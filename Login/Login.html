<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-mgx-overview="title">KickOut — تسجيل الدخول</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@700;800;900&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="./LoginStyle.css" />
</head>

<body>
  <div class="login-page">
    <div class="login-side">
      <div class="auth-slider" id="authSlider">
        <div class="login-card card-reveal" id="loginCard">

          <!-- Heading -->
          <h1 class="login-heading">جاهز لدخول الحلبة؟</h1>

          <!-- Supporting text -->
          <p class="login-subtext">سجل دخولك وابدأ التحدي.</p>

          <!-- Form -->
          <form class="login-form" id="loginForm" novalidate>
            <!-- Email Field -->
            <div class="form-group">
              <label for="email" class="form-label">رقم الهاتف</label>
              <div class="input-wrapper">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="2" y="4" width="20" height="16" rx="2" />
                  <path d="M22 7l-10 6L2 7" />
                </svg>
                <input type="tel" id="email" name="email" class="form-input" placeholder="123-456-7890" required>
              </div>
            </div>

            <!-- Password Field -->
            <div class="form-group">
              <label for="password" class="form-label">كلمة المرور</label>
              <div class="input-wrapper">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="11" width="18" height="11" rx="2" />
                  <path d="M7 11V7a5 5 0 0110 0v4" />
                </svg>
                <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required>
                <button type="button" class="toggle-password" id="togglePassword" aria-label="إظهار كلمة المرور">
                  <svg class="eye-icon eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                    <circle cx="12" cy="12" r="3" />
                  </svg>
                  <svg class="eye-icon eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" style="display:none;">
                    <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94" />
                    <path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19" />
                    <line x1="1" y1="1" x2="23" y2="23" />
                  </svg>
                </button>
              </div>
            </div>

            <!-- Remember Me & Forgot Password -->
            <div class="form-options">
              <label class="checkbox-wrapper">
                <input type="checkbox" id="remember" name="remember" class="checkbox-input">
                <span class="checkbox-custom"></span>
                <span class="checkbox-label">تذكرني</span>
              </label>
              <a href="#" class="forgot-link">نسيت كلمة المرور؟</a>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-primary" id="submitBtn">
              <span class="btn-text">ادخل الحلبة</span>
              <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M5 12h14M12 5l7 7-7 7" />
              </svg>
            </button>
          </form>


          <!-- Create Account -->
          <p class="create-account">
            ما عندك حساب؟
            <a href="#" class="create-link">أنشئ حساب جديد</a>
          </p>
        </div>
        <div class="login-card register-card" id="registerCard">

    <h1 class="login-heading">أنشئ حساب جديد</h1>

    <p class="login-subtext">
        أنشئ حسابك وابدأ المنافسة.
    </p>

    <form class="login-form" id="registerForm" novalidate>

        <!-- Phone -->
        <div class="form-group">
            <label for="registerPhone" class="form-label">
                رقم الهاتف
            </label>

            <div class="input-wrapper">

                <svg class="input-icon" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2">
                    <rect x="2" y="4" width="20" height="16" rx="2"/>
                    <path d="M22 7l-10 6L2 7"/>
                </svg>

                <input
                    type="tel"
                    id="registerPhone"
                    class="form-input"
                    placeholder="123-456-7890"
                    required
                >

            </div>
        </div>

        <!-- Password -->
        <div class="form-group">

            <label for="registerPassword" class="form-label">
                كلمة المرور
            </label>

            <div class="input-wrapper">

                <svg class="input-icon" viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2">

                    <rect x="3" y="11" width="18" height="11" rx="2"/>
                    <path d="M7 11V7a5 5 0 0110 0v4"/>

                </svg>

                <input
                    type="password"
                    id="registerPassword"
                    class="form-input"
                    placeholder="••••••••"
                    required
                >

            </div>

        </div>

        <!-- Confirm Password -->

        <div class="form-group">

            <label for="confirmPassword" class="form-label">
                تأكيد كلمة المرور
            </label>

            <div class="input-wrapper">

                <svg class="input-icon" viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2">

                    <rect x="3" y="11" width="18" height="11" rx="2"/>
                    <path d="M7 11V7a5 5 0 0110 0v4"/>

                </svg>

                <input
                    type="password"
                    id="confirmPassword"
                    class="form-input"
                    placeholder="••••••••"
                    required
                >

            </div>

        </div>

        <button type="submit" class="btn-primary">

            <span class="btn-text">
                إنشاء الحساب
            </span>

            <svg class="btn-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5">

                <path d="M5 12h14M12 5l7 7-7 7"/>

            </svg>

        </button>

    </form>

    <p class="create-account">

        لديك حساب بالفعل؟

        <a href="#" class="back-to-login">
            تسجيل الدخول
        </a>

    </p>

</div>
        
      </div>
    </div>

    <div class="page-transition">

      <div class="page-transition">

        <div class="portal"></div>


        <div class="particles"></div>


      </div>

    </div>


    <!-- RIGHT SIDE - Illustration -->
    <div class="illustration-side" id="illustrationSide">
      <div class="illustration-wrapper" id="parallaxWrapper">
        <!-- Arcade Room SVG Illustration -->
        <svg class="arcade-illustration" viewBox="0 0 840 900" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Background Floor -->
          <rect x="0" y="0" width="800" height="900" fill="#111827" />

          <!-- Neon Grid Floor -->
          <g opacity="0.3">
            <line x1="0" y1="700" x2="800" y2="700" stroke="#3B82F6" stroke-width="1" />
            <line x1="0" y1="750" x2="800" y2="750" stroke="#3B82F6" stroke-width="0.5" />
            <line x1="0" y1="800" x2="800" y2="800" stroke="#3B82F6" stroke-width="0.5" />
            <line x1="0" y1="850" x2="800" y2="850" stroke="#3B82F6" stroke-width="0.5" />
            <line x1="100" y1="700" x2="50" y2="900" stroke="#3B82F6" stroke-width="0.5" />
            <line x1="200" y1="700" x2="150" y2="900" stroke="#3B82F6" stroke-width="0.5" />
            <line x1="300" y1="700" x2="250" y2="900" stroke="#3B82F6" stroke-width="0.5" />
            <line x1="400" y1="700" x2="400" y2="900" stroke="#3B82F6" stroke-width="0.5" />
            <line x1="500" y1="700" x2="550" y2="900" stroke="#3B82F6" stroke-width="0.5" />
            <line x1="600" y1="700" x2="650" y2="900" stroke="#3B82F6" stroke-width="0.5" />
            <line x1="700" y1="700" x2="750" y2="900" stroke="#3B82F6" stroke-width="0.5" />
          </g>

          <!-- Wrestling Ring -->
          <g class="parallax-layer" data-speed="0.02">
            <!-- Ring Base/Platform -->
            <path d="M150 580 L650 580 L700 650 L100 650 Z" fill="#1E3A5F" stroke="#3B82F6" stroke-width="3" />
            <path d="M100 650 L700 650 L700 680 L100 680 Z" fill="#0F2744" />

            <!-- Ring Mat -->
            <rect x="180" y="480" width="440" height="100" rx="4" fill="#1F2937" stroke="#EF4444" stroke-width="3" />

            <!-- Ring Posts -->
            <rect x="178" y="350" width="12" height="230" rx="3" fill="#FBBF24" />
            <rect x="612" y="350" width="12" height="230" rx="3" fill="#FBBF24" />
            <rect x="178" y="340" width="12" height="20" rx="6" fill="#EF4444" />
            <rect x="612" y="340" width="12" height="20" rx="6" fill="#EF4444" />

            <!-- Ring Ropes -->
            <line x1="193" y1="380" x2="609" y2="380" stroke="#3B82F6" stroke-width="6" stroke-linecap="round" />
            <line x1="192" y1="420" x2="610" y2="420" stroke="#EF4444" stroke-width="5" stroke-linecap="round" />
            <line x1="191" y1="460" x2="612" y2="460" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"
              opacity="0.6" />

            <!-- Ring Logo -->
            <text x="400" y="540" text-anchor="middle" font-family="Tajawal" font-weight="900" font-size="36"
              fill="#FBBF24" opacity="0.8">KICKOUT</text>
          </g>

          <!-- Arcade Machine Left -->
          <g class="parallax-layer" data-speed="0.04">
            <!-- Cabinet Body -->
            <rect x="50" y="280" width="120" height="280" rx="8" fill="#1E293B" stroke="#3B82F6" stroke-width="3" />
            <!-- Screen -->
            <rect x="65" y="300" width="90" height="70" rx="4" fill="#0F172A" />
            <rect x="70" y="305" width="80" height="60" rx="2" fill="#111827" />
            <!-- Screen Content - pixel art -->
            <rect x="85" y="320" width="8" height="8" fill="#EF4444" />
            <rect x="97" y="320" width="8" height="8" fill="#3B82F6" />
            <rect x="109" y="320" width="8" height="8" fill="#FBBF24" />
            <rect x="121" y="320" width="8" height="8" fill="#EF4444" />
            <rect x="90" y="335" width="30" height="4" rx="1" fill="#3B82F6" opacity="0.7" />
            <rect x="85" y="345" width="40" height="4" rx="1" fill="#FBBF24" opacity="0.5" />
            <!-- Joystick Area -->
            <rect x="75" y="385" width="60" height="40" rx="4" fill="#0F172A" />
            <circle cx="95" cy="405" r="8" fill="#374151" stroke="#4B5563" stroke-width="2" />
            <circle cx="95" cy="405" r="4" fill="#EF4444" />
            <circle cx="125" cy="400" r="5" fill="#3B82F6" />
            <circle cx="125" cy="415" r="5" fill="#FBBF24" />
            <!-- Coin Slot -->
            <rect x="90" y="500" width="30" height="6" rx="3" fill="#374151" />
            <!-- Neon Trim -->

          </g>

          <!-- Arcade Machine Right -->
          <g class="parallax-layer" data-speed="0.04">
            <!-- Cabinet Body -->
            <rect x="630" y="300" width="120" height="260" rx="8" fill="#1E293B" stroke="#EF4444" stroke-width="3" />
            <!-- Screen -->
            <rect x="645" y="320" width="90" height="70" rx="4" fill="#0F172A" />
            <rect x="650" y="325" width="80" height="60" rx="2" fill="#111827" />
            <!-- Screen Content -->
            <rect x="665" y="340" width="12" height="12" fill="#FBBF24" />
            <rect x="683" y="340" width="12" height="12" fill="#EF4444" />
            <rect x="701" y="340" width="12" height="12" fill="#3B82F6" />
            <rect x="670" y="360" width="35" height="4" rx="1" fill="#EF4444" opacity="0.7" />
            <!-- Controls -->
            <rect x="655" y="405" width="60" height="40" rx="4" fill="#0F172A" />
            <circle cx="675" cy="425" r="8" fill="#374151" stroke="#4B5563" stroke-width="2" />
            <circle cx="675" cy="425" r="4" fill="#FBBF24" />
            <circle cx="705" cy="420" r="5" fill="#EF4444" />
            <circle cx="705" cy="435" r="5" fill="#3B82F6" />
            <!-- Coin Slot -->
            <rect x="670" y="510" width="30" height="6" rx="3" fill="#374151" />
            <!-- Neon Trim -->

          </g>

          <!-- Neon Signs -->
          <g class="parallax-layer" data-speed="0.06">
            <!-- "FIGHT" Neon Sign -->
            <rect x="280" y="120" width="240" height="60" rx="8" fill="none" stroke="#FBBF24" stroke-width="3"
              opacity="0.9" />
            <rect x="285" y="125" width="230" height="50" rx="6" fill="none" stroke="#FBBF24" stroke-width="1"
              opacity="0.4" />
            <text x="400" y="160" text-anchor="middle" font-family="Tajawal" font-weight="900" font-size="32"
              fill="#FBBF24" class="neon-text">FIGHT!</text>


          </g>

          <!-- Floating Pixel Elements -->
          <g class="parallax-layer" data-speed="0.08">
            <!-- Pixel Hearts -->


            <!-- Pixel Star -->


            <!-- Pixel Lightning -->


            <!-- Pixel Crown -->

          </g>

          <!-- Controller -->
          <g class="parallax-layer" data-speed="0.03">
            <g transform="translate(300, 220)">
              <!-- Controller Body -->
              <path
                d="M0 30 C0 15 15 0 40 0 L160 0 C185 0 200 15 200 30 L200 60 C200 90 170 100 150 100 L50 100 C30 100 0 90 0 60 Z"
                fill="#1E293B" stroke="#4B5563" stroke-width="2" />
              <!-- D-Pad -->
              <rect x="30" y="35" width="30" height="10" rx="2" fill="#374151" />
              <rect x="40" y="25" width="10" height="30" rx="2" fill="#374151" />
              <!-- Buttons -->
              <circle cx="150" cy="35" r="8" fill="#EF4444" />
              <circle cx="170" cy="45" r="8" fill="#3B82F6" />
              <circle cx="150" cy="55" r="8" fill="#FBBF24" />
              <circle cx="130" cy="45" r="8" fill="#10B981" />
              <!-- Center -->
              <rect x="80" y="42" width="30" height="8" rx="4" fill="#374151" />
            </g>
          </g>

          <!-- Ambient Glow Effects -->
          <circle cx="110" cy="350" r="80" fill="#3B82F6" opacity="0.05" />
          <circle cx="690" cy="380" r="80" fill="#EF4444" opacity="0.05" />
          <circle cx="400" cy="500" r="120" fill="#FBBF24" opacity="0.03" />

          <!-- Top Neon Accent Lines -->
          <line x1="0" y1="50" x2="250" y2="50" stroke="#3B82F6" stroke-width="2" opacity="0.4" />
          <line x1="550" y1="50" x2="800" y2="50" stroke="#EF4444" stroke-width="2" opacity="0.4" />
          <line x1="0" y1="55" x2="200" y2="55" stroke="#3B82F6" stroke-width="1" opacity="0.2" />
          <line x1="600" y1="55" x2="800" y2="55" stroke="#EF4444" stroke-width="1" opacity="0.2" />

        </svg>
      </div>
    </div>
  </div>


  <script type="module" src="./LoginScript.js"></script>
</body>

</html>
