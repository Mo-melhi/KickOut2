<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-mgx-overview="title">KickOut — تسجيل الدخول</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@700;800;900&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="./LoginStyle.css" />
</head>

<body>
  <div class="login-page">
    <div class="login-side">
      <div class="auth-slider" id="authSlider">
        <div class="login-card card-reveal" id="loginCard">

          <!-- Heading -->
          <h1 class="login-heading">جاهز لدخول الحلبة؟</h1>

          <!-- Supporting text -->
          <p class="login-subtext">سجل دخولك وابدأ التحدي.</p>

          <!-- Form -->
          <form class="login-form" id="loginForm" novalidate>
            <!-- Email Field -->
            <div class="form-group">
              <label for="email" class="form-label">رقم الهاتف</label>
              <div class="input-wrapper">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="2" y="4" width="20" height="16" rx="2" />
                  <path d="M22 7l-10 6L2 7" />
                </svg>
                <input type="tel" id="email" name="email" class="form-input" placeholder="123-456-7890" required>
              </div>
            </div>

            <!-- Password Field -->
            <div class="form-group">
              <label for="password" class="form-label">كلمة المرور</label>
              <div class="input-wrapper">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="11" width="18" height="11" rx="2" />
                  <path d="M7 11V7a5 5 0 0110 0v4" />
                </svg>
                <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required>
                <button type="button" class="toggle-password" id="togglePassword" aria-label="إظهار كلمة المرور">
                  <svg class="eye-icon eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                    <circle cx="12" cy="12" r="3" />
                  </svg>
                  <svg class="eye-icon eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" style="display:none;">
                    <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94" />
                    <path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19" />
                    <line x1="1" y1="1" x2="23" y2="23" />
                  </svg>
                </button>
              </div>
            </div>

            <!-- Remember Me & Forgot Password -->
            <div class="form-options">
              <label class="checkbox-wrapper">
                <input type="checkbox" id="remember" name="remember" class="checkbox-input">
                <span class="checkbox-custom"></span>
                <span class="checkbox-label">تذكرني</span>
              </label>
              <a href="#" class="forgot-link">نسيت كلمة المرور؟</a>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-primary" id="submitBtn">
              <span class="btn-text">ادخل الحلبة</span>
              <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M5 12h14M12 5l7 7-7 7" />
              </svg>
            </button>
          </form>


          <!-- Create Account -->
          <p class="create-account">
            ما عندك حساب؟
            <a href="#" class="create-link">أنشئ حساب جديد</a>
          </p>
        </div>
        <div class="login-card register-card" id="registerCard">

          <h1 class="login-heading">أنشئ حساب جديد</h1>

          <p class="login-subtext">
            أنشئ حسابك وابدأ المنافسة.
          </p>

          <form class="login-form" id="registerForm" novalidate>

            <!-- Phone -->
            <div class="form-group">
              <label for="registerPhone" class="form-label">
                رقم الهاتف
              </label>

              <div class="input-wrapper">

                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="2" y="4" width="20" height="16" rx="2" />
                  <path d="M22 7l-10 6L2 7" />
                </svg>

                <input type="tel" id="registerPhone" class="form-input" placeholder="123-456-7890" required>

              </div>
            </div>

            <!-- Password -->
            <div class="form-group">

              <label for="registerPassword" class="form-label">
                كلمة المرور
              </label>

              <div class="input-wrapper">

                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

                  <rect x="3" y="11" width="18" height="11" rx="2" />
                  <path d="M7 11V7a5 5 0 0110 0v4" />

                </svg>

                <input type="password" id="registerPassword" class="form-input" placeholder="••••••••" required>

              </div>

            </div>

            <!-- Confirm Password -->

            <div class="form-group">

              <label for="confirmPassword" class="form-label">
                تأكيد كلمة المرور
              </label>

              <div class="input-wrapper">

                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

                  <rect x="3" y="11" width="18" height="11" rx="2" />
                  <path d="M7 11V7a5 5 0 0110 0v4" />

                </svg>

                <input type="password" id="confirmPassword" class="form-input" placeholder="••••••••" required>

              </div>

            </div>

            <button type="submit" class="btn-primary">

              <span class="btn-text">
                إنشاء الحساب
              </span>

              <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">

                <path d="M5 12h14M12 5l7 7-7 7" />

              </svg>

            </button>

          </form>

          <p class="create-account">

            لديك حساب بالفعل؟

            <a href="./Login/Login.html" class="back-to-login">
              تسجيل الدخول
            </a>

          </p>

        </div>

      </div>
    </div>
  </div>


  <script type="module" src="./LoginScript.js"></script>
</body>

</html>
